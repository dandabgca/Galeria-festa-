<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeria da Festa</title>

<style>

body{
    margin:0;
    padding:20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

h1{
    margin-bottom:20px;
}

.botoes button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2196f3;
    color:white;
    font-size:16px;
}

.container{
    position:relative;
    width:100%;
    max-width:400px;
    aspect-ratio:9/16;
    margin:auto;
    overflow:hidden;
    background:#000;
    border-radius:10px;
}

#camera{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform: scale(0.8);
}

#moldura{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    pointer-events:none;
    z-index:2;
}

#capturar{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#4caf50;
    color:white;
    cursor:pointer;
}

#fotoCanvas{
    display:none;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>


<h1>📸 Galeria Noah e Valentina</h1>


<div class="botoes">

<button onclick="trocarMoldura('Moldura1.png')">
Moldura 1
</button>

<button onclick="trocarMoldura('Moldura2.png')">
Moldura 2
</button>

<button onclick="trocarMoldura('Moldura3.png')">
Moldura 3
</button>

</div>


<div class="container">

<video
id="camera"
autoplay
playsinline
muted>
</video>


<img
id="moldura"
src="Moldura1.png">

</div>


<br>

<button id="capturar">
📸 Tirar Foto
</button>


<canvas id="fotoCanvas"></canvas>


<script>


const SUPABASE_URL =
"https://wnbarrxdifratefmujch.supabase.co";


const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InduYmFycnhkaWZyYXRlZm11amNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNTM3OTMsImV4cCI6MjA5OTcyOTc5M30.70ZCtnf8rdkhPdgaJqsNEl9F8UxHRWgkDMTFqvi-SDI";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const video =
document.getElementById("camera");


const canvas =
document.getElementById("fotoCanvas");


const ctx =
canvas.getContext("2d");


const moldura =
document.getElementById("moldura");


async function iniciarCamera(){

try{

const stream =
await navigator.mediaDevices.getUserMedia({

video:{
    facingMode:{ ideal:"user" },
    aspectRatio:9/16
},

audio:false

});


video.srcObject = stream;


}catch(erro){

alert(
"Erro ao abrir câmera: "
+ erro.message
);

}

}


iniciarCamera();
    function trocarMoldura(nomeArquivo){

    const img = new Image();

    img.onload = function(){
        moldura.src = nomeArquivo;
    };

    img.onerror = function(){
        alert("Moldura não encontrada: " + nomeArquivo);
    };

    img.src = nomeArquivo;

}



document
.getElementById("capturar")
.addEventListener("click", async ()=>{


    if(!video.videoWidth){

        alert("A câmera ainda não carregou.");
        return;

    }


    // Define o tamanho final em Story 9:16

    const largura = 1080;
    const altura = 1920;


    canvas.width = largura;
    canvas.height = altura;


    // Ajusta a câmera para preencher o Story

    const proporcaoVideo =
    video.videoWidth / video.videoHeight;


    const proporcaoCanvas =
    largura / altura;


    let sx = 0;
    let sy = 0;
    let sw = video.videoWidth;
    let sh = video.videoHeight;


    if(proporcaoVideo > proporcaoCanvas){

        sw =
        video.videoHeight * proporcaoCanvas;

        sx =
        (video.videoWidth - sw) / 2;

    }else{

        sh =
        video.videoWidth / proporcaoCanvas;

        sy =
        (video.videoHeight - sh) / 2;

    }


    ctx.drawImage(
        video,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        largura,
        altura
    );


    // Coloca a moldura por cima

    const img = new Image();


    img.onload = async function(){


        ctx.drawImage(
            img,
            0,
            0,
            largura,
            altura
        );


        canvas.toBlob(
        async(blob)=>{


            const nomeArquivo =
            "foto_" +
            Date.now() +
            ".png";



            const {error} =
            await supabaseClient
            .storage
            .from("fotos-noah-valentina")
            .upload(
                nomeArquivo,
                blob,
                {
                    contentType:
                    "image/png"
                }
            );



            if(error){

                alert(
                "Erro ao enviar foto: "
                + error.message
                );

                return;

            }



            alert(
            "📸 Foto salva na galeria!"
            );


        },
        "image/png"
        );


    };


    img.src =
    moldura.src;


});


</script>


</body>
</html>
