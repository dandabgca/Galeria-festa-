<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeria da Festa</title>

<style>
body{
    margin:0;
    padding:20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

h1{
    margin-bottom:20px;
}

.botoes{
    margin-bottom:15px;
}

.botoes button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.container{
    position:relative;
    display:inline-block;
    width:100%;
    max-width:400px;
}

#camera{
    width:100%;
    border-radius:10px;
}

#moldura{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

#fotoCanvas{
    display:none;
}

#capturar{
    margin-top:15px;
    padding:12px 20px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Galeria da Festa</h1>

<div class="botoes">
    <button onclick="trocarMoldura('Moldura1.png')">Moldura 1</button>
    <button onclick="trocarMoldura('Moldura2.png')">Moldura 2</button>
    <button onclick="trocarMoldura('moldura3.png')">Moldura 3</button>
</div>

<div class="container">

    <video id="camera" autoplay playsinline></video>

    <img
        id="moldura"
        src="Moldura1.png"
        alt="Moldura">

</div>

<br>

<button id="capturar">
📸 Tirar Foto
</button>

<canvas id="fotoCanvas"></canvas>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("fotoCanvas");
const contexto = canvas.getContext("2d");

navigator.mediaDevices.getUserMedia({
    video:{
        facingMode:"user"
    }
})
.then(stream=>{
    video.srcObject = stream;
})
.catch(()=>{
    alert("Não foi possível acessar a câmera.");
});

function trocarMoldura(arquivo){
    document.getElementById("moldura").src = arquivo;
}

document.getElementById("capturar").addEventListener("click", ()=>{

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    contexto.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const moldura = document.getElementById("moldura");

    const img = new Image();

    img.onload = function(){

        contexto.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        const link = document.createElement("a");

        link.download = "foto-festa.png";

        link.href = canvas.toDataURL("image/png");

        link.click();
    };

    img.src = moldura.src;

});

</script>

</body>
</html>
