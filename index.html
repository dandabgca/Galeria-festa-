<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeria da Festa</title>

<style>

body{
    margin:0;
    padding:20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

h1{
    margin-bottom:20px;
}

.botoes button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2196f3;
    color:white;
}

.container{

    position:relative;
    display:inline-block;
    width:100%;
    max-width:400px;
    overflow:hidden;

}


#camera{

    width:100%;
    display:block;
    border-radius:10px;
    position:relative;
    z-index:1;

}


#moldura{

    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;

}


#capturar{

    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#4caf50;
    color:white;
    cursor:pointer;

}


#fotoCanvas{

    display:none;

}

</style>

</head>


<body>


<h1>📸 Galeria da Festa</h1>


<div class="botoes">

<button onclick="trocarMoldura('Moldura1.png')">
Moldura 1
</button>


<button onclick="trocarMoldura('Moldura2.png')">
Moldura 2
</button>


<button onclick="trocarMoldura('Moldura3.png')">
Moldura 3
</button>


</div>



<div class="container">


<video id="camera" autoplay playsinline></video>


<img id="moldura" src="Moldura1.png">


</div>


<br>


<button id="capturar">
📸 Tirar Foto
</button>



<canvas id="fotoCanvas"></canvas>



<script>


const video = document.getElementById("camera");

const canvas = document.getElementById("fotoCanvas");

const ctx = canvas.getContext("2d");

const moldura = document.getElementById("moldura");




// ABRIR CÂMERA

navigator.mediaDevices.getUserMedia({

    video:{
        facingMode:"user"
    },

    audio:false

})

.then(stream=>{

    video.srcObject = stream;


    video.onloadedmetadata = ()=>{

        video.play();

    };


})

.catch(error=>{

    alert("Erro ao abrir câmera: " + error);

});





// TROCAR MOLDURA

function trocarMoldura(nomeArquivo){


    const nova = new Image();


    nova.onload=function(){

        moldura.src = nomeArquivo;

    };


    nova.onerror=function(){

        alert("Não encontrei a imagem: " + nomeArquivo);

    };


    nova.src = nomeArquivo;


}






// TIRAR FOTO

document.getElementById("capturar")
.addEventListener("click",()=>{


    if(!video.videoWidth){

        alert("A câmera ainda está carregando.");

        return;

    }



    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;



    // FOTO

    ctx.drawImage(

        video,

        0,

        0,

        canvas.width,

        canvas.height

    );





    // MOLDURA

    const img = new Image();


    img.onload=function(){


        ctx.drawImage(

            img,

            0,

            0,

            canvas.width,

            canvas.height

        );



        const link=document.createElement("a");


        link.download="foto-festa.png";


        link.href=canvas.toDataURL("image/png");


        link.click();



    };



    img.src=moldura.src;



});



</script>


</body>
</html>
