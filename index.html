<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galeria da Festa</title>

<style>

body{
    margin:0;
    padding:20px;
    text-align:center;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

h1{
    margin-bottom:20px;
}

.botoes button{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#2196f3;
    color:white;
    font-size:16px;
}

.container{
    position:relative;
    width:100%;
    max-width:400px;
    margin:auto;
}

#camera{
    width:100%;
    height:auto;
    display:block;
    background:#000;
    border-radius:10px;
}

#moldura{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:2;
}

#capturar{
    margin-top:20px;
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#4caf50;
    color:white;
    cursor:pointer;
}

#fotoCanvas{
    display:none;
}

</style>
</head>

<body>

<h1>📸 Galeria da Festa</h1>

<div class="botoes">

<button onclick="trocarMoldura('Moldura1.png')">
Moldura 1
</button>

<button onclick="trocarMoldura('Moldura2.png')">
Moldura 2
</button>

<button onclick="trocarMoldura('Moldura3.png')">
Moldura 3
</button>

</div>

<div class="container">

<video
    id="camera"
    autoplay
    playsinline
    muted>
</video>

<img
    id="moldura"
    src="Moldura1.png"
    alt="Moldura">

</div>

<br>

<button id="capturar">
📸 Tirar Foto
</button>

<canvas id="fotoCanvas"></canvas>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("fotoCanvas");
const ctx = canvas.getContext("2d");
const moldura = document.getElementById("moldura");

async function iniciarCamera() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
            video.play();
        };

    } catch (erro) {

        console.error(erro);

        alert(
            "Erro ao abrir a câmera: " +
            erro.message
        );

    }

}

iniciarCamera();

function trocarMoldura(nomeArquivo){

    const img = new Image();

    img.onload = function(){
        moldura.src = nomeArquivo;
    };

    img.onerror = function(){
        alert("Imagem não encontrada: " + nomeArquivo);
    };

    img.src = nomeArquivo;

}

document.getElementById("capturar")
.addEventListener("click", () => {

    if (!video.videoWidth) {

        alert("A câmera ainda não carregou.");

        return;

    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const img = new Image();

    img.onload = function(){

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        const link = document.createElement("a");

        link.download = "foto-festa.png";

        link.href = canvas.toDataURL("image/png");

        link.click();

    };

    img.src = moldura.src;

});

</script>

</body>
</html>
